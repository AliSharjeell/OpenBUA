<title>OpenBUA Bento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #121215;
    --border: #27272a;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #007AFF;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .shimmer {
    background: linear-gradient(90deg, #52525b 0%, #fafafa 50%, #52525b 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmerWave 2.4s ease-in-out infinite;
  }
  @keyframes shimmerWave {
    0% { background-position: 120% 0; }
    100% { background-position: -120% 0; }
  }
  @keyframes gateDrain {
    0% { width: 100%; }
    100% { width: 8%; }
  }
  .gate-fill { animation: gateDrain 10s linear infinite; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<div id="root"></div>

        },
      },
    },
  };
</script>
